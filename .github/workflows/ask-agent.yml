name: ask-agent

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to reply in
        required: true
        default: "1"
      text:
        description: Request text; begin it with @WoyouWoyou
        required: true

permissions:
  issues: write

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BODY: ${{ inputs.text }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: process.env.BODY,
            })
